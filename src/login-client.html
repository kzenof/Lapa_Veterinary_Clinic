<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход пользователя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-page">
    <form class="auth" action="cabinet.html">
      <h1>Войти как пользователь</h1>
      <div class="field">
        <label>Почта или номер телефона</label>
        <input value="ivanov_ivan">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" value="password">
      </div>
      <button class="btn-black" type="submit">Войти</button>
      <div class="links">
        <div>Забыли пароль?</div>
        <div>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
      </div>
    </form>
  </div>
</body>
</html>
